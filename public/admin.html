<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración · El Rey de las Redes</title>
<style>
:root{--bg:#0b0b0c;--surface:#141416;--ink:#f3ede0;--muted:#9a9488;--line:#2a2824;--gold:#c9a24a;--alert:#e05252;--ok:#3fae6b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:Georgia,serif;font-weight:400;font-size:30px;margin:0 0 4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:30px 0 10px;font-weight:600}
.muted{color:var(--muted)}
input,button{font:inherit}
input{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:10px 12px}
button{background:transparent;border:1px solid #3a362f;color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--gold)}
button.pri{background:var(--gold);border-color:var(--gold);color:#0b0b0c;font-weight:600}
button.danger{border-color:#5a2a2a;color:#ff9a9a}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.card b{display:block;font-family:Georgia,serif;font-weight:400;font-size:26px}
.table{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{border-top:0;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td img{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
a{color:var(--gold)}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.no{border-color:var(--alert);color:var(--alert)}
#login{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#msg{min-height:1.4em;margin-top:8px}
.token{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:var(--surface);border:1px solid var(--gold);border-radius:8px;padding:10px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Administración</h1>
  <p class="muted">El Rey de las Redes · solo para ti.</p>
  <form id="login">
    <input id="pw" type="password" placeholder="Contraseña de administrador" autocomplete="current-password" aria-label="Contraseña">
    <button class="pri" type="submit">Entrar</button>
  </form>
  <div id="msg" role="status"></div>
  <div id="app" hidden></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = c => (c / 100).toLocaleString('es-ES') + ' €';
  const fmt = t => new Date(t).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  let pw = sessionStorage.getItem('rr-admin') || '';

  async function call(method, body) {
    const r = await fetch('/api/admin', { method, headers: { 'x-admin-password': pw, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Error');
    return d;
  }

  async function load() {
    const d = await call('GET');
    $('login').hidden = true; $('app').hidden = false; $('msg').textContent = '';
    const names = Object.fromEntries(d.creators.map(c => [c.id, '@' + c.handle]));
    const pending = d.creators.filter(c => c.verify_requested_at && !c.verified);
    const reqs = d.creators.filter(c => c.requested_at && !c.invited_at).sort((a, b) => a.requested_at < b.requested_at ? -1 : 1);
    $('app').innerHTML = `
      <h2>Resumen · temporada ${esc(d.season)}</h2>
      <div class="cards">
        <div class="card"><span class="muted">Cobrado esta temporada*</span><b>${(d.seasonTotalShown).toLocaleString('es-ES')} €</b></div>
        <div class="card"><span class="muted">Creadores</span><b>${d.creators.length}</b></div>
        <div class="card"><span class="muted">Apoyos mensuales activos</span><b>${d.activeSubs}</b></div>
      </div>
      <p class="muted" style="font-size:12px">* De los últimos 100 pagos. El dato exacto, con comisiones, está en tu panel de Stripe.</p>
      <div class="acts" style="margin:8px 0 0"><button data-a="testNotify">Probar aviso de Telegram</button></div>

      <h2>Solicitudes de entrada gratis (${reqs.length})</h2>
      ${reqs.length ? `<div class="table"><table><tr><th></th><th>Cuenta</th><th>Nicho</th><th>Dice tener</th><th>Pedido</th><th></th></tr>
        ${reqs.map(c => `<tr>
          <td>${c.photo_url ? `<img src="${esc(c.photo_url)}" alt="">` : ''}</td>
          <td>${esc(c.name)}<br><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.platform)} · @${esc(c.handle)} ↗</a></td>
          <td>${esc(CATS[c.cat] || c.cat || '')}</td>
          <td><b>${(c.request_followers || 0).toLocaleString('es-ES')}</b> seguidores</td>
          <td>${fmt(c.requested_at)}</td>
          <td><div class="acts"><button class="pri" data-a="acceptRequest" data-id="${c.id}">Aceptar</button><button class="danger" data-a="rejectRequest" data-id="${c.id}">Rechazar</button></div></td></tr>`).join('')}</table></div>
        <p class="muted" style="font-size:13px">Abre su perfil (↗) y comprueba que tiene 5.000 seguidores o más. Al aceptar, entra en el ranking con la etiqueta «Invitado»: escríbele por privado para avisarle. Al rechazar, la solicitud se borra.</p>`
        : '<p class="muted">No hay solicitudes pendientes.</p>'}

      ${visitsHTML(d)}

      ${invitesHTML(d)}

      ${pending.length ? `<h2>Verificaciones pendientes (${pending.length})</h2>` : ''}
      ${pending.length ? `<div class="table"><table><tr><th>Cuenta</th><th>Código que debe tener en la bio</th><th>Pedido</th><th></th></tr>
        ${pending.map(c => `<tr><td><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.platform)} · @${esc(c.handle)}</a></td><td><b>${esc(c.verify_code)}</b></td><td>${fmt(c.verify_requested_at)}</td>
          <td><div class="acts"><button class="pri" data-a="approve" data-id="${c.id}">Aprobar</button><button data-a="reject" data-id="${c.id}">Rechazar</button></div></td></tr>`).join('')}</table></div>
        <p class="muted" style="font-size:13px">Abre el perfil, comprueba que el código está en la bio y aprueba.</p>` : ''}

      <h2>Creadores</h2>
      <p class="muted" style="font-size:13px;margin-top:0">Para dar el sello verde, abre su perfil, comprueba que la cuenta es real y pulsa «Verificar».</p>
      <div class="table"><table><tr><th></th><th>Cuenta</th><th>Estado</th><th>Clics</th><th>Alta</th><th></th></tr>
        ${d.creators.map(c => `<tr>
          <td>${c.photo_url ? `<img src="${esc(c.photo_url)}" alt="">` : ''}</td>
          <td>${esc(c.name)}<br><a href="${esc(c.url)}" target="_blank" rel="noopener" class="muted">${esc(c.platform)} · @${esc(c.handle)}</a></td>
          <td>${c.verified ? '<span class="pill ok">Verificado</span>' : '<span class="pill">Sin verificar</span>'} ${c.hidden ? '<span class="pill no">Oculto</span>' : ''} ${c.requested_at && !c.invited_at ? '<span class="pill">Solicitud pendiente</span>' : c.invited_at ? '<span class="pill">Invitado</span>' : ''}</td>
          <td>${c.clicks}</td><td>${fmt(c.created_at)}</td>
          <td><div class="acts">
            ${c.verified ? `<button data-a="unverify" data-id="${c.id}">Quitar sello</button>` : `<button data-a="approve" data-id="${c.id}">Verificar</button>`}
            ${c.hidden ? `<button data-a="unhide" data-id="${c.id}">Mostrar</button>` : `<button class="danger" data-a="hide" data-id="${c.id}">Ocultar</button>`}
            ${c.photo_url ? `<button class="danger" data-a="removePhoto" data-id="${c.id}">Quitar foto</button>` : ''}
            <button data-a="resetOwner" data-id="${c.id}" title="Genera un acceso nuevo para el dueño real">Nuevo acceso</button>
          </div></td></tr>`).join('') || '<tr><td colspan="6" class="muted">Aún no hay creadores.</td></tr>'}
      </table></div>
      <div id="token-out"></div>

      <h2>Últimos pagos</h2>
      <div class="table"><table><tr><th>Fecha</th><th>Tipo</th><th>Creador</th><th>Fan</th><th>Importe</th></tr>
        ${d.payments.map(p => `<tr><td>${fmt(p.created_at)}</td><td>${p.kind === 'bid' ? 'Puja' : p.monthly ? 'Apoyo mensual' : 'Apoyo'}</td><td>${esc(names[p.creator_id] || '—')}</td><td>${esc(p.nick || '')}</td><td>${eur(p.amount_cents)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Aún no hay pagos.</td></tr>'}
      </table></div>`;
  }

  function invitesHTML(d) {
    if (d.invites === null) return `<h2>Invitaciones gratis</h2><p class="muted">Falta activarlas: en Supabase → SQL Editor, ejecuta el bloque «Invitaciones gratis» del archivo supabase/schema.sql.</p>`;
    const base = location.origin + '/?invitacion=';
    const now = Date.now();
    return `<h2>Invitaciones gratis</h2>
      <p class="muted" style="font-size:13px;margin-top:0">Crea un enlace para que creadores que tú elijas entren sin pagar. Aparecerán con 0 € y la etiqueta «Invitado». Cada enlace sirve para un número máximo de personas y caduca.</p>
      <form id="inv-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <input id="inv-note" placeholder="Para quién (solo lo ves tú)" maxlength="60" style="flex:1 1 220px">
        <label class="muted" style="font-size:13px">Personas <input id="inv-max" type="number" min="1" max="100" value="5" style="width:70px"></label>
        <label class="muted" style="font-size:13px">Días <input id="inv-days" type="number" min="1" max="90" value="7" style="width:70px"></label>
        <button class="pri" type="submit">Crear enlace</button>
      </form>
      <div class="table"><table><tr><th>Enlace</th><th>Para</th><th>Usos</th><th>Caduca</th><th></th></tr>
        ${d.invites.map(i => { const exp = i.expires_at && new Date(i.expires_at).getTime() <= now; const full = i.uses >= i.max_uses; const ok = !exp && !full;
          return `<tr><td style="white-space:normal;word-break:break-all"><code>${esc(base + i.code)}</code></td><td>${esc(i.note || '')}</td><td>${i.uses} / ${i.max_uses}</td>
          <td>${ok ? fmt(i.expires_at) : `<span class="pill no">${full ? 'Agotado' : 'Caducado'}</span>`}</td>
          <td><div class="acts">${ok ? `<button data-copy="${esc(base + i.code)}">Copiar</button><button class="danger" data-close="${esc(i.code)}">Desactivar</button>` : ''}</div></td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">Aún no has creado ninguna invitación.</td></tr>'}
      </table></div>`;
  }
  document.addEventListener('submit', async ev => {
    if (ev.target.id !== 'inv-form') return;
    ev.preventDefault();
    try {
      const r = await call('POST', { action: 'createInvite', note: $('inv-note').value, maxUses: $('inv-max').value, days: $('inv-days').value });
      await load();
      const link = location.origin + '/?invitacion=' + r.code;
      try { await navigator.clipboard.writeText(link); $('msg').textContent = 'Enlace creado y copiado: ' + link; } catch (e) { $('msg').textContent = 'Enlace creado: ' + link; }
    } catch (e) { $('msg').textContent = e.message; }
  });
  document.addEventListener('click', async ev => {
    const c = ev.target.closest('button[data-copy]');
    if (c) { try { await navigator.clipboard.writeText(c.dataset.copy); c.textContent = 'Copiado'; } catch (e) { $('msg').textContent = c.dataset.copy; } return; }
    const x = ev.target.closest('button[data-close]');
    if (x) { if (!confirmInline(x)) return; try { await call('POST', { action: 'closeInvite', code: x.dataset.close }); await load(); } catch (e) { $('msg').textContent = e.message; } }
  });

  const SRC = { tiktok: 'TikTok', instagram: 'Instagram', youtube: 'YouTube', twitch: 'Twitch', kick: 'Kick', google: 'Google', directo: 'Directo o app', otros: 'Otras webs', fan: 'Mensaje de un fan', dm: 'Tus mensajes privados' };
  const CATS = { humor: 'Humor', musica: 'Música y baile', gaming: 'Gaming', deportes: 'Deportes y fitness', belleza: 'Belleza y moda', lifestyle: 'Lifestyle', viajes: 'Viajes', comida: 'Comida y cocina', salud: 'Salud y bienestar', educacion: 'Educación', tecnologia: 'Tecnología', negocios: 'Finanzas y negocios', motor: 'Motor', mascotas: 'Animales', familia: 'Familia', arte: 'Arte y creatividad', entretenimiento: 'Entretenimiento', hogar: 'Hogar', noticias: 'Noticias', espiritualidad: 'Espiritualidad', otro: 'Otro' };
  function visitsHTML(d) {
    if (d.visits === null) return `<h2>Visitas</h2><p class="muted">Falta activar el contador: en Supabase → SQL Editor, ejecuta el bloque «Contador de visitas» del archivo supabase/schema.sql.</p>`;
    const days = (n) => { const t = new Date(d.today + 'T12:00:00'); t.setDate(t.getDate() - n); return t.toISOString().slice(0, 10); };
    const sum = (rows, k) => rows.reduce((s, r) => s + r[k], 0);
    const evRows = d.visits.filter(v => v.source.startsWith('ev_') && v.day >= days(6));
    const ev = name => evRows.filter(v => v.source === 'ev_' + name).reduce((s, r) => s + r.uniques, 0);
    d = { ...d, visits: d.visits.filter(v => !v.source.startsWith('ev_')) };
    const todayRows = d.visits.filter(v => v.day === d.today), weekRows = d.visits.filter(v => v.day >= days(6));
    const bySrc = rows => { const m = {}; rows.forEach(r => { m[r.source] = m[r.source] || { views: 0, uniques: 0 }; m[r.source].views += r.views; m[r.source].uniques += r.uniques; }); return Object.entries(m).sort((a, b) => b[1].uniques - a[1].uniques); };
    const perDay = []; for (let i = 0; i < 14; i++) { const day = days(i), rows = d.visits.filter(v => v.day === day); perDay.push([day, sum(rows, 'uniques'), sum(rows, 'views')]); }
    const max = Math.max(1, ...perDay.map(p => p[1]));
    const noTrack = localStorage.getItem('rr-notrack') === 'true';
    return `<h2>Visitas</h2>
      <div class="cards">
        <div class="card"><span class="muted">Personas hoy</span><b>${sum(todayRows, 'uniques')}</b><span class="muted" style="font-size:12px">${sum(todayRows, 'views')} visitas a la página</span></div>
        <div class="card"><span class="muted">Personas últimos 7 días</span><b>${sum(weekRows, 'uniques')}</b><span class="muted" style="font-size:12px">${sum(weekRows, 'views')} visitas a la página</span></div>
      </div>
      <div class="table" style="margin-top:10px"><table><tr><th>Embudo (7 días)</th><th>Personas</th><th></th></tr>
        ${[['Entran en la web', sum(weekRows, 'uniques')], ['Abren el formulario de creador', ev('abre_puja')], ['Abren el formulario de apoyo', ev('abre_apoyo')], ['Pulsan «Pagar» y van a Stripe', ev('va_a_pagar')], ['Cancelan en Stripe', ev('cancela_pago')], ['Pagan', d.payments.filter(p => p.created_at >= days(6)).length]]
          .map(([t, n]) => `<tr><td>${t}</td><td>${n}</td><td style="width:45%"><div style="height:8px;border-radius:4px;background:var(--gold);width:${Math.round(n / Math.max(1, sum(weekRows, 'uniques')) * 100)}%"></div></td></tr>`).join('')}
      </table></div>
      <div class="table" style="margin-top:10px"><table><tr><th>De dónde vienen (7 días)</th><th>Personas</th><th>Visitas</th></tr>
        ${bySrc(weekRows).map(([k, v]) => `<tr><td>${esc(SRC[k] || k)}</td><td>${v.uniques}</td><td>${v.views}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Aún no hay visitas registradas.</td></tr>'}
      </table></div>
      <div class="table" style="margin-top:10px"><table><tr><th>Día</th><th>Personas</th><th></th></tr>
        ${perDay.map(([day, u]) => `<tr><td>${day.split('-').reverse().slice(0, 2).join('/')}</td><td>${u}</td><td style="width:60%"><div style="height:8px;border-radius:4px;background:var(--gold);width:${Math.round(u / max * 100)}%"></div></td></tr>`).join('')}
      </table></div>
      <p class="muted" style="font-size:13px">«Personas» cuenta cada navegador una vez al día. «Directo o app» incluye a quien entra desde la app de TikTok o Instagram, porque esas apps no siempre dicen de dónde viene la visita. Para distinguirlo, comparte el enlace como <b>elreydelasredes.es/?r=tiktok</b> o <b>?r=instagram</b>.</p>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="notrack" ${noTrack ? 'checked' : ''}> No contar mis propias visitas desde este navegador</label>`;
  }
  document.addEventListener('change', ev => { if (ev.target.id === 'notrack') { localStorage.setItem('rr-notrack', ev.target.checked ? 'true' : 'false'); $('msg').textContent = ev.target.checked ? 'Tus visitas desde este navegador ya no se cuentan.' : 'Tus visitas vuelven a contarse.'; } });

  $('login').addEventListener('submit', async ev => {
    ev.preventDefault(); pw = $('pw').value;
    try { await load(); sessionStorage.setItem('rr-admin', pw); } catch (e) { $('msg').textContent = e.message; }
  });
  document.addEventListener('click', async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (['hide', 'removePhoto', 'resetOwner', 'rejectRequest'].includes(a) && !confirmInline(b)) return;
    b.disabled = true;
    try {
      const r = await call('POST', { action: a, creatorId: b.dataset.id });
      await load();
      if (a === 'testNotify') $('msg').textContent = 'Aviso enviado: mira tu Telegram.';
      if (r.ownerToken) $('token-out').innerHTML = `<div class="token">Acceso nuevo creado. Envíaselo al dueño real de la cuenta para que lo pegue en la web (Comunidad → Recuperar acceso):<br><br>${esc(b.dataset.id)}:${esc(r.ownerToken)}</div>`;
    } catch (e) { $('msg').textContent = e.message; b.disabled = false; }
  });
  // Doble pulsación para acciones delicadas, sin ventanas emergentes
  function confirmInline(b) {
    if (b.dataset.armed) return true;
    b.dataset.armed = '1'; const t = b.textContent; b.textContent = '¿Seguro? Pulsa otra vez';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = t; } }, 3000);
    return false;
  }
  if (pw) load().catch(() => { pw = ''; sessionStorage.removeItem('rr-admin'); });
})();
</script>
</body>
</html>
